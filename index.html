<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUBBIOGUSTO</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body data-page="home">
    <div id="intro-overlay" class="intro-overlay" aria-hidden="true">
        <div class="intro-content">
            <img src="css/images/canesito.gif" alt="Intro animation" class="intro-gif">
        </div>
    </div>
    <div class="side-tag">DUBBIO GUSTO ???</div>
    <main>
        <div class="container-two">
            <div class="left">
                <img src="css/images/titolo%20sito.gif" alt="Titolo sito" class="home-logo">
            </div>
            <aside class="right-panel">
                <div class="buttons">
                    <a href="eventi.html" class="btn">Eventi</a>
                    <a href="shop.html" class="btn">Shop</a>
                    <a href="contatti.html" class="btn">Contatti</a>
                    <!--<a href="#boo?stiamoancoracapendo" class="btn">Chi siamo</a> -->
                    <a href="FAQ.html" class="btn">FAQ</a>
                    <a href="mistero.html" class="btn">Mistero</a>
                    <a href="oroscopo.html" class="btn"><span>OROSCOPO<br>DEL GIORNO</span></a>
                     <!-- <a href="prodotti.html" class="btn">Spasso</a>-->
                </div>
            </aside>
        </div>
    </main>
    <footer>
        &copy; <span id="year"></span> DUBBIOGUSTO
    </footer>
        <script>
            document.getElementById('year').textContent = new Date().getFullYear();
            (function() {
                const overlay = document.getElementById('intro-overlay');
                const gif = overlay.querySelector('.intro-gif');
                const barkAudio = new Audio('css/images/BARK3+noise (1).mp3');
                barkAudio.preload = 'auto';
                barkAudio.volume = 0.85;
                barkAudio.load();

                const spawnSparks = (x, y) => {
                    const count = 8;
                    for (let i = 0; i < count; i++) {
                        const spark = document.createElement('span');
                        spark.className = 'firework-spark';
                        const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.4;
                        const distance = 28 + Math.random() * 18;
                        const dx = Math.cos(angle) * distance;
                        const dy = Math.sin(angle) * distance;
                        spark.style.left = `${x}px`;
                        spark.style.top = `${y}px`;
                        spark.style.setProperty('--dx', `${dx}px`);
                        spark.style.setProperty('--dy', `${dy}px`);
                        document.body.appendChild(spark);
                        spark.addEventListener('animationend', () => spark.remove());
                    }
                };

                const hideOverlay = () => {
                    overlay.classList.add('intro-hidden');
                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 500);
                };

                gif.addEventListener('error', hideOverlay);
                gif.addEventListener('click', (event) => {
                    barkAudio.currentTime = 0;
                    barkAudio.play().catch(() => {
                        // Playback may be blocked by browser policy, but overlay still hides.
                    });
                    spawnSparks(event.clientX, event.clientY);
                    hideOverlay();
                });
            })();
        </script>
</body>
</html>
